<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300">
<style>.red,.g{fill:#ff2e43}.deep{fill:#b3101f}.tint{fill:#3a0a11}.ink{fill:#f7eaeb}.brk{fill:none;stroke:#ff2e43;stroke-width:2}.g{font:12px monospace}.g.hot{fill:#ff6b77}.g.cut{fill:#08040a;font-size:14px}</style><!--
  blocks      red 160x268 bled off the top (the brand, largest) · red-deep 128x188 · red-tint 160x228 bleeding off the right edge · ink 48x32 once for relief — about a third of 960x300
  arrangement one tall red slab with two satellites, bottoms on one line space-6 above the edge, space-4 gutters, square corners (radius-none) with two red corner brackets like every panel
  pattern     binary glyphs, from "a rotating 3D brain made of 0s and 1s": 48 mono 0/1 glyphs at a space-4 x 28px pitch over the tint, a few in red-glow; seven cut out of the slab in void
  scales      sides in space-4 multiples; gutters space-4; pitch space-4; corners radius-none; bracket stroke 2px as in bundle.css
-->
